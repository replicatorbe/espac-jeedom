# Modèle de secrets — copier en secrets.yaml (gitignoré) et remplir.
#   cp secrets.example.yaml secrets.yaml

wifi_ssid: "MonReseau"
wifi_password: "mot-de-passe-wifi"

# Mot de passe du point d'accès de secours (« ESPAC <device_name> »), 8 caractères minimum.
ap_password: "changez-moi"

# Mot de passe des mises à jour OTA.
ota_password: "changez-moi"

# Clé de chiffrement de l'API native ESPHome (plugin Jeedom esphomebe) :
# 32 octets aléatoires encodés en base64 (44 caractères). Pour la générer :
#   openssl rand -base64 32
# ou : python3 -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Mot de passe de l'interface web (utilisateur : admin).
web_password: "changez-moi"
