# espac-jeedom — passerelle ESP32 <-> climatiseur Airton (UART) <-> Jeedom (MQTT).
# Contrat MQTT : ../docs/CONTRAT-MQTT.md
# Aucune régulation ici : l'ESP reflète l'état réel de la clim et exécute les commandes.

substitutions:
  device_name: espac-salon          # [a-z0-9-], utilisé dans les topics espac/<dev>/...
  friendly_name: "ESPAC Salon"
  fw_version: "0.1.1"
  mqtt_broker: 192.168.0.125
  # Broches (ESP32 DevKit 30 broches)
  uart_tx_pin: GPIO16               # TX ESP -> RX clim (fil bleu côté clim)
  uart_rx_pin: GPIO17               # RX ESP <- TX clim (fil vert côté clim) — attention 5 V !
  led_pin: GPIO2                    # LED intégrée
  # Réception
  rx_gap_ms: "30"                   # silence inter-octets marquant la fin d'une trame
  rx_check_crc: "false"             # CRC des trames RX encore inconnu : ne pas rejeter
  cmd_ignore_ms: "3000"             # fenêtre d'ignorance des RX contradictoires après commande

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "espac.espac-jeedom"
    version: ${fw_version}
  includes:
    - espac_airton.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto &gw = espac::gateway();
          gw.check_rx_crc = ${rx_check_crc};
          gw.ignore_window_ms = ${cmd_ignore_ms};
          espac::splitter().set_gap(${rx_gap_ms});
          gw.set_publisher([](const std::string &key, const std::string &value, bool retain) -> bool {
            if (!id(mqtt_client).is_connected())
              return false;
            return id(mqtt_client).publish("espac/${device_name}/state/" + key, value, 0, retain);
          });
          gw.set_sender([](const std::vector<uint8_t> &frame) {
            id(uart_bus).write_array(frame.data(), frame.size());
            id(led_flash).execute();
          });
          // Un seul abonnement pour toutes les commandes : espac/<dev>/set/<clé>
          static const std::string prefix = "espac/${device_name}/set/";
          id(mqtt_client).subscribe(prefix + "#", [](const std::string &topic, const std::string &payload) {
            if (topic.compare(0, prefix.size(), prefix) != 0)
              return;
            espac::gateway().on_set(topic.substr(prefix.size()), payload, millis());
          });

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0                      # pas de logs sur UART0 (TX0/RX0) : consultables via wifi (API / web)
  level: DEBUG                      # mise au point : trames RX visibles dans les logs (repasser en INFO ensuite)

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPAC ${device_name}"
    password: !secret ap_password

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_password

# API native : permet la coexistence avec le plugin Jeedom esphomebe (facultatif).
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s                # sinon redémarrage toutes les 15 min sans client API (Jeedom passe par MQTT)

# Interface web locale (logs en direct, utile pour la mise au point). Facultative.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    type: digest
    username: admin
    password: !secret web_password

mqtt:
  id: mqtt_client
  broker: ${mqtt_broker}
  port: 1883
  discovery: false
  discover_ip: false
  topic_prefix: espac/${device_name}
  log_topic: null                   # pas de logs sur MQTT : seul le contrat est publié
  birth_message:
    topic: espac/${device_name}/status
    payload: online
    retain: true
  will_message:
    topic: espac/${device_name}/status
    payload: offline
    retain: true
  shutdown_message:
    topic: espac/${device_name}/status
    payload: offline
    retain: true

uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

# LED : output + script (pas d'entité ESPHome, donc rien de publié en MQTT hors contrat).
output:
  - platform: gpio
    id: led_out
    pin:
      number: ${led_pin}
      ignore_strapping_warning: true   # GPIO2 = LED intégrée, sans risque ici

script:
  - id: led_flash
    mode: restart
    then:
      - output.turn_on: led_out
      - delay: 60ms
      - output.turn_off: led_out

globals:
  - id: rx_bytes
    type: uint32_t
    initial_value: "0"
  - id: mqtt_was_connected
    type: bool
    initial_value: "false"

interval:
  # Lecture continue de l'UART + découpage en trames + envoi des commandes en attente.
  - interval: 10ms
    then:
      - lambda: |-
          auto &sp = espac::splitter();
          auto &gw = espac::gateway();
          uint8_t b;
          bool got = false;
          while (id(uart_bus).available() > 0 && id(uart_bus).read_byte(&b)) {
            sp.push(b, millis());
            id(rx_bytes)++;
            got = true;
          }
          if (!got) {
            for (auto &frame : sp.poll(millis())) {
              id(led_flash).execute();
              gw.on_rx_frame(frame, millis());
            }
          }
          gw.loop(millis());

  # (Re)connexion MQTT : info + republication complète. Fait ici et non dans mqtt.on_connect,
  # car avec esp-idf on_connect est appelé avant que publish() soit possible.
  - interval: 1s
    then:
      - lambda: |-
          bool now_connected = id(mqtt_client).is_connected();
          if (now_connected && !id(mqtt_was_connected)) {
            char ip[network::IP_ADDRESS_BUFFER_SIZE] = "";
            for (auto &a : wifi::global_wifi_component->get_ip_addresses()) {
              if (a.is_set()) {
                a.str_to(ip);
                break;
              }
            }
            std::string info = "{\"name\":\"${device_name}\",\"mac\":\"" + get_mac_address_pretty() +
                               "\",\"ip\":\"" + std::string(ip) + "\",\"version\":\"${fw_version}\"," +
                               "\"fw\":\"espac-jeedom\"}";
            // Si l'info échoue, on retentera à la seconde suivante.
            if (!id(mqtt_client).publish("espac/${device_name}/info", info, 0, true))
              return;
            auto &gw = espac::gateway();
            gw.publish_all();
            gw.publish_diag(wifi::global_wifi_component->wifi_rssi(), millis() / 1000, millis());
          }
          id(mqtt_was_connected) = now_connected;

  # Diagnostic : rssi, uptime, unit_link (pas de SNTP nécessaire).
  - interval: 60s
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected())
            return;
          espac::gateway().publish_diag(wifi::global_wifi_component->wifi_rssi(), millis() / 1000, millis());

  # unit_link réactif (passage OFF dès 60 s sans trame, sans attendre le cycle de diag).
  - interval: 5s
    then:
      - lambda: |-
          if (!id(mqtt_client).is_connected())
            return;
          espac::gateway().publish_link(millis());
          static uint32_t last_rx_bytes = UINT32_MAX;
          if (id(rx_bytes) != last_rx_bytes &&
              id(mqtt_client).publish("espac/${device_name}/state/rx_bytes", std::to_string(id(rx_bytes)), 0, true))
            last_rx_bytes = id(rx_bytes);
